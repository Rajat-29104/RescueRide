spring.application.name=rescueride-backend
server.port=${PORT:8081}
server.forward-headers-strategy=framework

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

rescueride.supabase.url=${NEXT_PUBLIC_SUPABASE_URL:}
rescueride.supabase.anon-key=${NEXT_PUBLIC_SUPABASE_ANON_KEY:}
rescueride.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
rescueride.webhook.secret=${RESCUERIDE_WEBHOOK_SECRET:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
